<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email-Validator</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="images/email.svg" alt="logo">
                <span>eValidate</span>
            </div>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <form action="/submit" method="post">
                <h1>Enter your email to validate</h1>
                <form action="/submit" method="post">
                 
                <input placeholder="Enter your email to validate...." type="text" id="username" name="username" required >
                    <br><br>
                    <!-- Submit button -->
                    <input id="submitBtn" class="btn" type="submit" value="Submit">
                  </form>
            </div>
        </div>
        <div class="container">
            <h2>Result</h2>
            <div id="resultcontainer">

            </div>
        </div>
    </main>

    <footer>
        Copyright | EValidate.com | All Rights reserved
    </footer>
    <script src="js/index.js"></script>
   
</body>

</html>
